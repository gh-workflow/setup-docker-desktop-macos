name: Test Suite

"on":
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Ensure workflow actions use immutable refs
        uses: joshjohanning/ensure-immutable-actions@bc90ba67ffdea94121d930e649ba3d6219dcf275  # v2.7.0
        with:
          include-first-party: 'true'
          write-job-summary: 'on-failure-only'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run linters
        run: |
          scripts/lint.sh
