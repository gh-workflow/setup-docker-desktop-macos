name: Change Validation

"on":
  workflow_call:
# Auto-run on-push disabled to reduce costs on GH (free here, but still displayed rates for macOS are much higher)
#  pull_request:
#  push:
#    branches:
#      - main
  workflow_dispatch:

concurrency:
  group: change-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test-suite:
    uses: ./.github/workflows/test-suite.yml

  test-macos-hosted:
    uses: ./.github/workflows/test-macos-hosted.yml
