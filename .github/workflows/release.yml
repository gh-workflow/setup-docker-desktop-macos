name: Release

"on":
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  change-validation:
    uses: ./.github/workflows/change-validation.yml

  verify-release-refs:
    name: Verify release references
    needs: [change-validation]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verify README uses current tag
        env:
          ACTION_OWNER: ${{ github.repository_owner }}
          ACTION_REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          action_ref="${ACTION_OWNER}/${ACTION_REPO}"
          if grep -nP "${action_ref}@(?!${GITHUB_REF_NAME}\\b)" \
              README.md
          then
            echo "Found action refs not pinned to ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

  release:
    name: Publish release
    needs: [change-validation, verify-release-refs]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
