name: Change Validation

"on":
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: change-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test-suite:
    uses: ./.github/workflows/test-suite.yml

  test-macos-hosted:
    name: macOS hosted smoke (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15-intel
          - macos-26-intel
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Docker Desktop from main branch
        uses: gh-workflow/setup-docker-desktop-macos@main
        with:
          print_diagnostics: true

      - name: Validate Docker engine
        run: docker run --rm hello-world

      - name: Probe docker build backend
        run: |
          probe_dir="$(mktemp -d)"
          cat > "$probe_dir/Dockerfile" <<'EOF'
          FROM alpine:3.20
          RUN --mount=type=bind,source=.,target=/src,readonly true
          EOF
          docker build -f "$probe_dir/Dockerfile" "$probe_dir"
