name: Change Validation

"on":
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: change-validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-suite:
    uses: ./.github/workflows/test-suite.yml

  test-macos-hosted:
    name: macOS hosted smoke (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15-intel
          - macos-26-intel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Desktop macOS
        uses: ./
        with:
          print_diagnostics: true

      - name: Validate Docker engine
        run: docker run --rm hello-world

      - name: Probe docker build backend
        run: |
          probe_dir="$(mktemp -d)"
          cat > "$probe_dir/Dockerfile" <<'EOF'
          FROM alpine:3.20
          RUN --mount=type=bind,source=.,target=/src,readonly true
          EOF
          docker build -f "$probe_dir/Dockerfile" "$probe_dir"

  super-linter:
    name: Run linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Super-Linter
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854  # v9.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MULTI_STATUS: false
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_BASH: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
